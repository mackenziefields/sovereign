<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Publication model regression tests</title>
<!-- Run in a browser: http://localhost:8765/tests/publish-model.test.html   or headless: see TESTING.md. Uses fictional data only; touches no saved data (it never calls S.save). -->
<style>body{font:14px/1.5 system-ui;margin:20px}.pass{color:#0a6b2d}.fail{color:#b3261e;font-weight:700}pre{white-space:pre-wrap}</style></head>
<body><h1>Publication model regression tests</h1><pre id="out"></pre>
<script src="../js/config.js"></script><script src="../js/exhibits.js"></script><script src="../js/store.js"></script><script src="../js/publish-model.js"></script>
<script>
(function () {
  window.__before = localStorage.getItem('sovereign.v3');
  const S = window.Sovereign, M = S.pubModel, results = [];
  const t = (name, fn) => { try { const r = fn(); results.push([name, r === true || r === undefined, r === true || r === undefined ? '' : String(r)]); } catch (e) { results.push([name, false, 'threw: ' + e.message]); } };
  const iso = (s) => new Date(s).toISOString();
  const H = 3600000;

  // ---- fixtures (fictional) ----
  const crit = (arr, v2) => arr.map(([name, max, score, extra]) => ({ name, max, score, comment: '', ...(v2 ? { status: 'met', assessed: true } : {}), ...(extra || {}) }));
  const review = (arr, o) => { o = o || {}; const sc = arr.reduce((s, k) => s + k[2], 0), mx = arr.reduce((s, k) => s + k[1], 0);
    return { summary: 'Fictional review.', score: o.score != null ? o.score : Math.round(sc * 10) / 10, max: o.max != null ? o.max : mx, at: o.at || '2026-10-01T10:00:00Z', model: 'test', criteria: crit(arr, o.v2), findings: o.findings || [], ...(o.v2 ? { context: { schema: 2 } } : {}) }; };
  const RUB5 = [['Evidence', 30, 29], ['Accuracy', 25, 23], ['Fairness', 20, 18], ['Structure', 15, 14], ['Log', 10, 10]]; // 94
  const course = (asg, extra) => S.normalize({ app: 'sovereign', courses: [{ id: 'c1', title: 'Fixture', code: 'FX', modules: [{ id: 'm1', title: 'Module', assignments: asg }], ...(extra || {}) }] }).courses[0];
  const asg = (o) => ({ id: o.id || 'a1', title: o.title || 'Fixture assignment', kind: 'demonstrate', points: o.points != null ? o.points : 100, score: o.score !== undefined ? o.score : null, work: o.work || null, due: o.due || '' });
  const final = (fb, at, o) => ({ phase: 'final', deadline: (o && o.deadline) || '', first: null, final: { text: 'x', at, late: false, feedback: fb }, ...((o && o.firstSummary) ? { firstSummary: o.firstSummary } : {}) });
  const facts = (a) => M.reviewFacts(a);

  /* ===== 1. grade reconciliation ===== */
  t('matching record passes with no notes', () => { const c = course([asg({ score: 94, work: final(review(RUB5), '2026-10-01T10:00:00Z') })]); const f = facts(c.modules[0].assignments[0]); return f.ok && !f.checks.some((k) => k.level !== 'ok') || JSON.stringify(f.checks); });
  t('THE SAMPLE BUG: criteria add to 92 but the score says 94 -> substantive, numbers named', () => { const fb = review([['E', 30, 29], ['A', 25, 21], ['F', 20, 18], ['S', 15, 14], ['L', 10, 10]], { score: 94 }); const c = course([asg({ score: 94, work: final(fb, '2026-10-01T10:00:00Z') })]); const f = facts(c.modules[0].assignments[0]); const k = f.checks.find((x) => x.rule === 'R1'); return (!f.ok && k && k.level === 'substantive' && /92/.test(k.msg) && /94/.test(k.msg)) || JSON.stringify(f.checks); });
  t('a 0.2 difference is substantive (more than one rounding step)', () => { const fb = review([['A', 7, 5], ['B', 3, 2]], { score: 6.8 }); const c = course([asg({ points: 10, score: 6.8, work: final(fb, '2026-10-01T10:00:00Z') })]); const f = facts(c.modules[0].assignments[0]); return (!f.ok && f.checks.some((x) => x.rule === 'R1' && x.level === 'substantive')) || JSON.stringify(f.checks); });
  t('a 0.1 difference is one rounding step: allowed, reported as a note', () => { const fb = review([['A', 7, 5], ['B', 3, 2]], { score: 7.1 }); const c = course([asg({ points: 10, score: 7.1, work: final(fb, '2026-10-01T10:00:00Z') })]); const f = facts(c.modules[0].assignments[0]); const k = f.checks.find((x) => x.rule === 'R1'); return (f.ok && k.level === 'rounding') || JSON.stringify(f.checks); });
  t('float noise (0.1+0.2) is not a mismatch', () => { const fb = review([['A', 5, 0.1], ['B', 5, 0.2]], { score: 0.3 }); const c = course([asg({ points: 10, score: 0.3, work: final(fb, '2026-10-01T10:00:00Z') })]); const f = facts(c.modules[0].assignments[0]); return (f.ok && f.checks.every((x) => x.level === 'ok')) || JSON.stringify(f.checks); });
  t('maximum mismatch is substantive', () => { const fb = review(RUB5, { max: 90 }); const c = course([asg({ score: 94, work: final(fb, '2026-10-01T10:00:00Z') })]); const f = facts(c.modules[0].assignments[0]); return !f.ok && f.checks.some((x) => x.rule === 'R2' && x.level === 'substantive'); });
  t('Grades page score that does not follow from the review is substantive (R3)', () => { const c = course([asg({ score: 80, work: final(review(RUB5), '2026-10-01T10:00:00Z') })]); const f = facts(c.modules[0].assignments[0]); return !f.ok && f.checks.some((x) => x.rule === 'R3' && x.level === 'substantive'); });
  t('points edited after the review keep the same percentage: 94% of 50 = 47 passes', () => { const c = course([asg({ points: 50, score: 47, work: final(review(RUB5), '2026-10-01T10:00:00Z') })]); const f = facts(c.modules[0].assignments[0]); return f.ok || JSON.stringify(f.checks); });
  t('"not assessed" criteria are left out of both sums', () => { const fb = review([['A', 50, 45], ['B', 50, 0, { assessed: false, status: 'not-assessed' }]], { v2: true, score: 45, max: 50 }); const c = course([asg({ score: 90, work: final(fb, '2026-10-01T10:00:00Z') })]); const f = facts(c.modules[0].assignments[0]); return f.ok || JSON.stringify(f.checks); });
  t('recorded percentage is the Grades-page value (S.pctOf), not recomputed from the rubric', () => { const c = course([asg({ score: 94, work: final(review(RUB5), '2026-10-01T10:00:00Z') })]); const a = c.modules[0].assignments[0]; const f = facts(a); return f.recorded.pct === S.pctOf(a) && f.recorded.kind === 'ai'; });
  t('first review only: no grade is recorded yet (pending)', () => { const c = course([asg({ work: { phase: 'reviewed', deadline: iso('2026-10-04T10:00:00Z'), first: { text: 'x', at: '2026-10-01T10:00:00Z', feedback: review(RUB5) }, final: null } })]); const f = facts(c.modules[0].assignments[0]); return f.recorded.kind === 'pending' && f.recorded.pct === null; });
  t('assertPublishable blocks a contradictory course and names it', () => { const fb = review([['E', 30, 29], ['A', 25, 21], ['F', 20, 18], ['S', 15, 14], ['L', 10, 10]], { score: 94 }); const c = course([asg({ title: 'Story package', score: 94, work: final(fb, '2026-10-01T10:00:00Z') })]); const g = M.assertPublishable(c); return (!g.ok && g.diagnostics.length === 1 && g.diagnostics[0].assignment === 'Story package') || JSON.stringify(g); });
  t('assertPublishable only checks the selected assignments', () => { const bad = review([['E', 30, 29], ['A', 70, 21]], { score: 99 }), good = review(RUB5); const c = course([asg({ id: 'bad', score: 99, work: final(bad, '2026-10-01T10:00:00Z') }), asg({ id: 'good', score: 94, work: final(good, '2026-10-01T10:00:00Z') })]); return M.assertPublishable(c, ['good']).ok && !M.assertPublishable(c, ['bad']).ok; });

  /* ===== 2. course grade: 80/20, provisional vs final, taken from S.courseGrade ===== */
  const withCap = (modScore, capScore) => { const c = course([asg({ points: 100, score: modScore })]); c.capstone = S.makeCapstone({ title: 'Capstone', status: 'ready', weight: 20, assignments: [{ id: 'cap1', title: 'Cap', kind: 'demonstrate', capstone: true, points: 100, score: capScore, due: '' }] }); return c; };
  t('80/20 with a graded capstone: final, 0.8*90 + 0.2*95 = 91', () => { const c = withCap(90, 95); const f = M.courseFacts(c); return f.ok && f.grade.pct === 91 && f.grade.provisional === false && f.grade.basis === 'combined'; });
  t('ungraded capstone: module average only, labelled provisional, never counted as zero', () => { const c = withCap(90, null); const f = M.courseFacts(c); return f.grade.pct === 90 && f.grade.provisional === true; });
  t('course facts are exactly S.courseGrade (no second calculation)', () => { const c = withCap(88, 92); return JSON.stringify(M.courseFacts(c).grade) === JSON.stringify(S.courseGrade(c)); });
  t('no capstone: the course grade is the module average, as before', () => { const c = course([asg({ points: 100, score: 77 })]); const g = M.courseFacts(c).grade; return g.pct === 77 && !g.hasCapstone && !g.provisional; });

  /* ===== 3. timeline ===== */
  const FIRST = '2026-10-01T10:00:00.000Z', DEADLINE = new Date(Date.parse(FIRST) + 72 * H).toISOString();
  const summary = (at) => ({ at, late: false, score: 23, max: 100, model: 't', summary: 's', criteria: crit([['E', 50, 10], ['A', 50, 13]], false).map((k) => ({ ...k, status: '', assessed: true })), findings: [{ type: 'error', criterion: 'A', claim: 'Wrong date', quote: 'q', where: 'p1', located: true, fix: 'f' }] });
  t('resubmission inside the window with a SAVED first review: statement printed, window "within"', () => { const c = course([asg({ score: 94, work: final(review(RUB5), '2026-10-02T14:00:00Z', { deadline: DEADLINE, firstSummary: summary(FIRST) }) })]); const f = facts(c.modules[0].assignments[0]); return (f.timeline.window === 'within' && f.timeline.firstSource === 'saved' && f.timeline.statements.some((s) => /inside the 72-hour window/.test(s)) && /28/.test(String(f.timeline.statements[0]))) || JSON.stringify(f.timeline); });
  t('resubmission AFTER the deadline: never called timely', () => { const c = course([asg({ score: 94, work: final(review(RUB5), '2026-10-05T10:00:00Z', { deadline: DEADLINE, firstSummary: summary(FIRST) }) })]); const f = facts(c.modules[0].assignments[0]); return f.timeline.window === 'after' && !f.timeline.statements.some((s) => /inside/.test(s)); });
  t('the sample dates (Oct 28 first review, Nov 1 resubmission) are NOT within 72 hours', () => { const first = '2026-10-28T10:00:00Z', dl = new Date(Date.parse(first) + 72 * H).toISOString(); const c = course([asg({ score: 94, work: final(review(RUB5), '2026-11-01T10:00:00Z', { deadline: dl, firstSummary: summary(first) }) })]); const f = facts(c.modules[0].assignments[0]); return f.timeline.window === 'after'; });
  t('exactly at the deadline counts as inside', () => { const c = course([asg({ score: 94, work: final(review(RUB5), DEADLINE, { deadline: DEADLINE, firstSummary: summary(FIRST) }) })]); return facts(c.modules[0].assignments[0]).timeline.window === 'within'; });
  t('older record (no kept first review): first time is DERIVED from the deadline and labelled so; no first score is invented', () => { const c = course([asg({ score: 94, work: final(review(RUB5), '2026-10-02T14:00:00Z', { deadline: DEADLINE }) })]); const f = facts(c.modules[0].assignments[0]); return f.timeline.firstSource === 'derived' && f.first === null && f.timeline.window === 'within'; });
  t('first review became the grade (final submitted at deadline minus 72 h): no window claim, no resubmission claim', () => { const c = course([asg({ score: 94, work: final(review(RUB5, { at: FIRST }), FIRST, { deadline: DEADLINE }) })]); const f = facts(c.modules[0].assignments[0]); return f.timeline.how === 'first-review' && f.timeline.window === 'no-resubmission' && f.timeline.statements.some((s) => /No resubmission/.test(s)) && !f.timeline.statements.some((s) => /inside/.test(s)); });
  t('missing deadline: no invented dates, no window claim', () => { const c = course([asg({ score: 94, work: final(review(RUB5), '2026-10-02T14:00:00Z', {}) })]); const f = facts(c.modules[0].assignments[0]); return f.timeline.firstAt === null && f.timeline.window !== 'within' && f.timeline.statements.every((s) => !/inside/.test(s)); });
  t('missing final timestamp is handled', () => { const w = final(review(RUB5), '', { deadline: DEADLINE, firstSummary: summary(FIRST) }); const c = course([asg({ score: 94, work: w })]); const f = facts(c.modules[0].assignments[0]); return f.timeline.window !== 'within' && M.fmtWhen('') === 'not recorded' && M.fmtWhen('garbage') === 'not recorded'; });
  t('final dated before the first review is flagged', () => { const c = course([asg({ score: 94, work: final(review(RUB5), '2026-09-20T10:00:00Z', { deadline: DEADLINE, firstSummary: summary(FIRST) }) })]); return facts(c.modules[0].assignments[0]).checks.some((k) => k.rule === 'R6' && !k.ok); });
  t('evidence attached without a review: no review facts, no timeline claims', () => { const c = course([asg({ score: null, work: { phase: 'final', deadline: '', first: null, final: { text: '', fileId: 'f1', fileName: 'a.pdf', fileType: 'application/pdf', fileSize: 10, at: '2026-10-02T10:00:00Z', late: false, feedback: null } } })]); const f = facts(c.modules[0].assignments[0]); return f.state === 'attached' && f.review === null && f.timeline.statements.length === 0; });
  t('the late flag is reported only when saved', () => { const w = final(review(RUB5), '2026-10-02T14:00:00Z', { deadline: DEADLINE, firstSummary: summary(FIRST) }); w.final.late = true; const f = facts(course([asg({ score: 94, work: w })]).modules[0].assignments[0]); return f.timeline.statements.some((s) => /late/.test(s)); });

  /* ===== 4. historical preservation (option B) ===== */
  t('finalizing via resubmission keeps a first-review summary with real values', () => { const a = { title: 'x', points: 100, score: null, kind: 'demonstrate', work: { phase: 'reviewed', deadline: DEADLINE, first: { text: 'v1', at: FIRST, late: false, fileId: '', feedback: review([['E', 50, 10], ['A', 50, 13]], { at: FIRST, findings: [{ type: 'error', criterion: 'A', claim: 'Wrong date', quote: 'q', where: 'p1', located: true, fix: 'f', note: 'n' }] }) }, final: null } }; const second = { text: 'v2', at: '2026-10-02T10:00:00Z', late: false, feedback: review(RUB5, { at: '2026-10-02T10:00:00Z' }) }; S.finalizeWork(a, second); const fs = a.work.firstSummary; return (a.work.phase === 'final' && fs && fs.at === FIRST && fs.score === 23 && fs.max === 100 && fs.criteria.length === 2 && fs.findings.length === 1 && a.work.first === null && a.score === 94) || JSON.stringify(a.work).slice(0, 300); });
  t('the final review stays authoritative: a.score comes from the final review, not the kept first one', () => { const a = { title: 'x', points: 100, score: null, kind: 'demonstrate', work: { phase: 'reviewed', deadline: DEADLINE, first: { text: 'v1', at: FIRST, late: false, fileId: '', feedback: review([['E', 50, 10], ['A', 50, 13]]) }, final: null } }; S.finalizeWork(a, { text: 'v2', at: '2026-10-02T10:00:00Z', late: false, feedback: review(RUB5) }); return a.score === 94; });
  t('the first review becoming the grade does NOT fabricate a summary', () => { const a = { title: 'x', points: 100, score: null, kind: 'demonstrate', work: { phase: 'reviewed', deadline: DEADLINE, first: { text: 'v1', at: FIRST, late: false, fileId: '', feedback: review(RUB5) }, final: null } }; S.finalizeWork(a); return a.work.firstSummary === undefined && a.work.final.at === FIRST; });
  t('the summary survives save/load normalisation unchanged', () => { const c = course([asg({ score: 94, work: final(review(RUB5), '2026-10-02T14:00:00Z', { deadline: DEADLINE, firstSummary: summary(FIRST) }) })]); const again = S.normalize(JSON.parse(JSON.stringify({ app: 'sovereign', courses: [c] }))).courses[0]; return JSON.stringify(again.modules[0].assignments[0].work.firstSummary) === JSON.stringify(c.modules[0].assignments[0].work.firstSummary); });
  t('older records gain NO new keys when normalised (nothing fabricated or altered)', () => { const c = course([asg({ score: 94, work: final(review(RUB5), '2026-10-02T14:00:00Z', { deadline: DEADLINE }) })]); const w = c.modules[0].assignments[0].work; const again = S.normalize(JSON.parse(JSON.stringify({ app: 'sovereign', courses: [c] }))).courses[0].modules[0].assignments[0].work; return !('firstSummary' in w) && JSON.stringify(w) === JSON.stringify(again); });
  t('a malformed kept summary is dropped, not repaired', () => { const c = course([asg({ score: 94, work: final(review(RUB5), '2026-10-02T14:00:00Z', { deadline: DEADLINE, firstSummary: { score: 5 } }) })]); return !('firstSummary' in c.modules[0].assignments[0].work); });

  /* ===== 5. read-only guarantee ===== */
  t('reviewFacts, courseFacts and assertPublishable never change the saved data', () => { const c = withCap(90, 95); const a = c.modules[0].assignments[0]; a.work = final(review(RUB5), '2026-10-02T14:00:00Z', { deadline: DEADLINE, firstSummary: summary(FIRST) }); a.score = 94; const before = JSON.stringify(c); M.reviewFacts(a); M.courseFacts(c); M.assertPublishable(c); return JSON.stringify(c) === before; });
  t('the tests never write saved data (S.save is not called)', () => localStorage.getItem('sovereign.v3') === window.__before);

  const out = document.getElementById('out');
  const bad = results.filter((r) => !r[1]);
  out.innerHTML = results.map((r) => '<span class="' + (r[1] ? 'pass' : 'fail') + '">' + (r[1] ? 'PASS ' : 'FAIL ') + r[0].replace(/</g, '&lt;') + (r[2] ? '  -> ' + r[2].replace(/</g, '&lt;') : '') + '</span>').join('\n') + '\n\nRESULT: ' + (results.length - bad.length) + ' passed, ' + bad.length + ' failed';
  document.title = 'RESULT ' + (results.length - bad.length) + '/' + results.length;
})();
</script></body></html>
